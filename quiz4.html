<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header, footer {
            background-color: #222;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        h1, h2 {
            text-align: center;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            margin-top: 30px;
        }

        figure {
            margin: 0;
            width: 260px;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            text-align: center;
            overflow: hidden;
        }

        figure img {
            width: 240px;
            height: 180px;
            object-fit: cover;
            border-radius: 4px;
            display: block;
            margin: 0 auto;
            transition: transform 0.3s ease;
        }

        figure img:hover {
            transform: scale(1.08);
        }

        figcaption {
            margin-top: 10px;
            font-size: 14px;
            color: #333;
        }

        .video-section {
            margin-top: 50px;
            text-align: center;
        }

        .video-wrapper {
            max-width: 560px;
            margin: 20px auto 0;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 315px;
            border: none;
            border-radius: 6px;
        }

        audio {
            margin-top: 20px;
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <!-- 
        Page Purpose: This page demonstrates working with images (figure/figcaption, 
        alt text, sizing), embedded media (YouTube iframe and audio), and a 
        CSS hover effect that enlarges images.
    -->

    <header>
        <h1>My Gallery</h1>
        <p>A small collection of images and media that I like.</p>
    </header>

    <main>
        <h2>Photo Gallery</h2>
        <div class="gallery">

            <figure>
                <img src="https://picsum.photos/id/1015/400/300" alt="Mountain landscape with a river winding through a valley">
                <figcaption>Mountains and river valley</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/id/1041/400/300" alt="Close-up of a small white flower in bloom">
                <figcaption>White flower in bloom</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/id/1074/400/300" alt="Wooden pathway leading through a green forest">
                <figcaption>Path through the forest</figcaption>
            </figure>

        </div>

        <section class="video-section">
            <h2>Featured Video</h2>
            <div class="video-wrapper">
                <iframe 
                    src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
                    title="Featured video" 
                    allowfullscreen>
                </iframe>
            </div>

            <h2>Featured Audio</h2>
            <audio controls>
                <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Muhammed Mahat. All rights reserved.</p>
    </footer>

</body>
</html>
